services:
  postgres:
    image: postgres:16-alpine
    container_name: microrad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-microrad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microrad}
      POSTGRES_DB: ${POSTGRES_DB:-microrad}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - microrad_pgdata:/var/lib/postgresql/data
    networks:
      - microrad-net
      # microrad-net:
      #   ipv4_address: 172.30.0.2
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-microrad} -d ${POSTGRES_DB:-microrad}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # FreeRADIUS v3 + driver postgresql — autentikasi RADIUS dari DB yang sama.
  # Container saling memanggil via hostname DNS Docker (postgres / freeradius).
  freeradius:
    build: ./docker/freeradius
    container_name: microrad-freeradius
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres # 172.30.0.2
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-microrad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microrad}
      POSTGRES_DB: ${POSTGRES_DB:-microrad}
      RADIUS_DEBUG: "0"
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp" # CoA / Disconnect-Request (RFC 5176)
    networks:
      - microrad-net
      # microrad-net:
      #   ipv4_address: 172.30.0.3

    depends_on:
      postgres:
        condition: service_healthy

  # MikroTik RouterOS CHR — RADIUS client + PPPoE server.
  # Inisialisasi via konsol: `docker attach microrad-chr`.
  # routeros:
  #   image: evilfreelancer/docker-routeros:latest
  #   container_name: microrad-chr
  #   restart: unless-stopped
  #   cap_add:
  #     - NET_ADMIN
  #   devices:
  #     - /dev/net/tun
  #     - /dev/kvm # omit on Apple Silicon (no KVM there; container uses QEMU emulation)
  #   ports:
  #     - "2222:22"
  #     - "2223:23"
  #     - "8291:8291"
  #     - "8728:8728"
  #     - "8729:8729"
  #   volumes:
  #     - routeros:/data
  #   networks:
  #     - default
  #     - microrad-net
  #     # microrad-net:
  #     #   ipv4_address: 172.30.0.4

networks:
  microrad-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  microrad_pgdata:
  # routeros:
