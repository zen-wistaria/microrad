# Listen CoA / Disconnect-Request (RFC 5176) — dipakai radclient/app
# untuk memutus sesi aktif & push perubahan rate-limit (Mikrotik-Rate-Limit)
# ke NAS MikroTik tanpa disconnect.
listen {
	type = coa
	ipaddr = *
	port = 3799

	# Permintaan CoA harus berasal dari RADIUS client terdaftar (clients.conf
	# / tabel nas). Secret sama dengan auth/accounting.
	client {
		ipaddr = *
		secret = testing123
	}
}

