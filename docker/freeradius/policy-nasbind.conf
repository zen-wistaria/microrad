# 1) check_nas_binding: Whitelist router NAS (radnasallow)
#    - Jika user ada di radnasallow: hanya router yang terdaftar yang diizinkan
#    - Jika user tidak ada di radnasallow: bebas login dari router NAS mana pun
check_nas_binding {
    if ("%{sql:SELECT COUNT(*) FROM radnasallow WHERE username='%{SQL-User-Name}'}" > 0) {
        if ("%{sql:SELECT COUNT(*) FROM radnasallow WHERE username='%{SQL-User-Name}' AND nasipaddress='%{Nas-IP-Address}'}" == 0) {
            update reply {
                &Reply-Message := "Not allowed from this router"
            }
            reject
        }
    }
}

# 2) check_simultaneous_use: Kontrol jumlah sesi simultan (Single / Multi Session)
#    - Mengecek jumlah sesi aktif yang berbeda perangkat (Calling-Station-Id)
#    - Mengabaikan sesi zombie yang tidak mengirim update > 3 menit
check_simultaneous_use {
    if ("%{control:Simultaneous-Use}" > 0) {
        if ("%{Calling-Station-Id}") {
            if ("%{sql:SELECT COUNT(*) FROM radacct WHERE username='%{SQL-User-Name}' AND acctstoptime IS NULL AND callingstationid != '%{Calling-Station-Id}' AND (acctupdatetime > NOW() - INTERVAL '3 minutes' OR (acctupdatetime IS NULL AND acctstarttime > NOW() - INTERVAL '3 minutes'))}" >= "%{control:Simultaneous-Use}") {
                update reply {
                    &Reply-Message := "Simultaneous-Use limit reached"
                }
                reject
            }
        }
        else {
            if ("%{sql:SELECT COUNT(*) FROM radacct WHERE username='%{SQL-User-Name}' AND acctstoptime IS NULL AND (acctupdatetime > NOW() - INTERVAL '3 minutes' OR (acctupdatetime IS NULL AND acctstarttime > NOW() - INTERVAL '3 minutes'))}" >= "%{control:Simultaneous-Use}") {
                update reply {
                    &Reply-Message := "Simultaneous-Use limit reached"
                }
                reject
            }
        }
    }
}

# 3) set_ippool_name: Dynamic Router-Aware Pool & Profile Resolution
#    Menemukan nama Profile / IP Pool spesifik untuk router tempat pelanggan dial-in (Nas-IP-Address)
#    berdasarkan AreaGroup wilayah pelanggan.
#    JIKA router tempat dial-in TIDAK memiliki Profile yang terdaftar pada wilayah pelanggan:
#    MAKA tolak (REJECT) koneksi agar pelanggan tidak mendapatkan profil/gateway yang salah.
set_ippool_name {
    # 1. Cari nama Profile pada router NAS ini yang sesuai dengan AreaGroup wilayah pelanggan
    update control {
        &Tmp-String-0 := "%{sql:SELECT p.name FROM ppp_profile p JOIN \"_AreaGroupToNasRouter\" agnr ON p.\"areaGroupId\" = agnr.\"A\" JOIN nas_router n ON agnr.\"B\" = n.id JOIN customer c ON c.\"areaGroupId\" = p.\"areaGroupId\" WHERE c.username = '%{SQL-User-Name}' AND n.\"ipAddress\" = '%{Nas-IP-Address}' LIMIT 1}"
    }

    # 2. Jika ditemukan Profile yang cocok untuk router NAS tempat dial-in:
    if ("%{control:Tmp-String-0}" != "") {
        # Pasang Pool-Name untuk modul sqlippool (mengoverride pool_name agar IP dialokasikan dari pool ini)
        update control {
            &Pool-Name := "%{control:Tmp-String-0}"
        }
        # Pasang Mikrotik-Group ke nama profile pada router ini (untuk gateway/local-address & parent-queue)
        update reply {
            &Mikrotik-Group := "%{control:Tmp-String-0}"
        }
        # Cek apakah profile ini menggunakan ipModule = 'mikrotik_pool'
        if ("%{sql:SELECT p.\"ipModule\" FROM ppp_profile p JOIN \"_AreaGroupToNasRouter\" agnr ON p.\"areaGroupId\" = agnr.\"A\" JOIN nas_router n ON agnr.\"B\" = n.id JOIN customer c ON c.\"areaGroupId\" = p.\"areaGroupId\" WHERE c.username = '%{SQL-User-Name}' AND n.\"ipAddress\" = '%{Nas-IP-Address}' LIMIT 1}" == "mikrotik_pool") {
            update reply {
                &Framed-Pool := "%{control:Tmp-String-0}"
            }
        }
        else {
            # ipModule = 'sql' (FreeRADIUS sqlippool yang mengalokasikan IP), jangan kirim Framed-Pool ke MikroTik
            update reply {
                &Framed-Pool !* ANY
            }
        }

        # Pasang DNS Server dari PPP Profile
        update control {
            &Tmp-String-1 := "%{sql:SELECT SPLIT_PART(p.\"dnsServers\", ',', 1) FROM ppp_profile p JOIN \"_AreaGroupToNasRouter\" agnr ON p.\"areaGroupId\" = agnr.\"A\" JOIN nas_router n ON agnr.\"B\" = n.id JOIN customer c ON c.\"areaGroupId\" = p.\"areaGroupId\" WHERE c.username = '%{SQL-User-Name}' AND n.\"ipAddress\" = '%{Nas-IP-Address}' LIMIT 1}"
            &Tmp-String-2 := "%{sql:SELECT SPLIT_PART(p.\"dnsServers\", ',', 2) FROM ppp_profile p JOIN \"_AreaGroupToNasRouter\" agnr ON p.\"areaGroupId\" = agnr.\"A\" JOIN nas_router n ON agnr.\"B\" = n.id JOIN customer c ON c.\"areaGroupId\" = p.\"areaGroupId\" WHERE c.username = '%{SQL-User-Name}' AND n.\"ipAddress\" = '%{Nas-IP-Address}' LIMIT 1}"
        }
        if ("%{control:Tmp-String-1}" != "") {
            update reply {
                &MS-Primary-DNS-Server := "%{control:Tmp-String-1}"
            }
        }
        if ("%{control:Tmp-String-2}" != "") {
            update reply {
                &MS-Secondary-DNS-Server := "%{control:Tmp-String-2}"
            }
        }

        # Pasang Session-Timeout & Idle-Timeout jika dikonfigurasikan
        update control {
            &Tmp-Integer-0 := "%{sql:SELECT COALESCE(p.\"sessionTimeout\", 0) FROM ppp_profile p JOIN \"_AreaGroupToNasRouter\" agnr ON p.\"areaGroupId\" = agnr.\"A\" JOIN nas_router n ON agnr.\"B\" = n.id JOIN customer c ON c.\"areaGroupId\" = p.\"areaGroupId\" WHERE c.username = '%{SQL-User-Name}' AND n.\"ipAddress\" = '%{Nas-IP-Address}' LIMIT 1}"
            &Tmp-Integer-1 := "%{sql:SELECT COALESCE(p.\"idleTimeout\", 0) FROM ppp_profile p JOIN \"_AreaGroupToNasRouter\" agnr ON p.\"areaGroupId\" = agnr.\"A\" JOIN nas_router n ON agnr.\"B\" = n.id JOIN customer c ON c.\"areaGroupId\" = p.\"areaGroupId\" WHERE c.username = '%{SQL-User-Name}' AND n.\"ipAddress\" = '%{Nas-IP-Address}' LIMIT 1}"
        }
        if ("%{control:Tmp-Integer-0}" > 0) {
            update reply {
                &Session-Timeout := "%{control:Tmp-Integer-0}"
            }
        }
        if ("%{control:Tmp-Integer-1}" > 0) {
            update reply {
                &Idle-Timeout := "%{control:Tmp-Integer-1}"
            }
        }
    }
    # 3. Router ini TIDAK memiliki Profile yang sesuai dengan AreaGroup wilayah pelanggan!
    else {
        # Cek fallback jika customer tidak memiliki areaGroupId (akses bebas)
        if ("%{sql:SELECT \"areaGroupId\" FROM customer WHERE username = '%{SQL-User-Name}'}" == "") {
            # Pelanggan tanpa area group: izinkan login
        }
        else {
            update reply {
                &Reply-Message := "Router tidak terdaftar dalam wilayah layanan pelanggan (Profile tidak ditemukan)"
            }
            reject
        }
    }
}

# 4) cleanup_ippool_reply: Hapus Framed-Pool dari paket respon jika Framed-IP-Address berhasil dialokasikan oleh sqlippool
cleanup_ippool_reply {
    if (reply:Framed-IP-Address && reply:Framed-Pool) {
        update reply {
            &Framed-Pool !* ANY
        }
    }
}
