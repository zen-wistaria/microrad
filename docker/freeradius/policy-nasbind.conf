# 1) check_nas_binding: Whitelist router NAS (radnasallow)
#    - Jika user ada di radnasallow: hanya router yang terdaftar yang diizinkan
#    - Jika user tidak ada di radnasallow: bebas login dari router NAS mana pun
check_nas_binding {
    if ("%{sql:SELECT COUNT(*) FROM radnasallow WHERE username='%{SQL-User-Name}'}" > 0) {
        if ("%{sql:SELECT COUNT(*) FROM radnasallow WHERE username='%{SQL-User-Name}' AND nasipaddress='%{Nas-IP-Address}'}" == 0) {
            update reply {
                &Reply-Message := "Not allowed from this router"
            }
            reject
        }
    }
}

# 2) check_multi_session_diff_nas: Multi-session harus berasal dari NAS berbeda
#    - Mencegah 1 akun dipakai 2x di router yang sama jika Simultaneous-Use > 1
check_multi_session_diff_nas {
    if ("%{control:Simultaneous-Use}" > 1) {
        if ("%{sql:SELECT COUNT(*) FROM radacct WHERE username='%{SQL-User-Name}' AND acctstoptime IS NULL AND nasipaddress='%{Nas-IP-Address}'}" > 0) {
            update reply {
                &Reply-Message := "Already active session on this router"
            }
            reject
        }
    }
}

# 3) set_ippool_name: Sinkronkan Framed-Pool dari radreply ke control:Pool-Name untuk sqlippool
set_ippool_name {
    if (reply:Framed-Pool) {
        update control {
            &Pool-Name := "%{reply:Framed-Pool}"
        }
    }
}

# 4) cleanup_ippool_reply: Hapus Framed-Pool dari paket respon jika Framed-IP-Address berhasil dialokasikan oleh sqlippool
cleanup_ippool_reply {
    if (reply:Framed-IP-Address && reply:Framed-Pool) {
        update reply {
            &Framed-Pool !* ANY
        }
    }
}


