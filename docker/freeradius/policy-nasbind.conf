# 1) check_nas_binding: Whitelist router NAS (radnasallow)
#    - Jika user ada di radnasallow: hanya router yang terdaftar yang diizinkan
#    - Jika user tidak ada di radnasallow: bebas login dari router NAS mana pun
check_nas_binding {
    if ("%{sql:SELECT COUNT(*) FROM radnasallow WHERE username='%{SQL-User-Name}'}" > 0) {
        if ("%{sql:SELECT COUNT(*) FROM radnasallow WHERE username='%{SQL-User-Name}' AND nasipaddress='%{Nas-IP-Address}'}" == 0) {
            update reply {
                &Reply-Message := "Not allowed from this router"
            }
            reject
        }
    }
}

# 2) check_simultaneous_use: Kontrol jumlah sesi simultan (Single / Multi Session)
#    - Mengecek jumlah sesi aktif yang berbeda perangkat (Calling-Station-Id)
#    - Mengabaikan sesi zombie yang tidak mengirim update > 3 menit
check_simultaneous_use {
    if ("%{control:Simultaneous-Use}" > 0) {
        if ("%{Calling-Station-Id}") {
            if ("%{sql:SELECT COUNT(*) FROM radacct WHERE username='%{SQL-User-Name}' AND acctstoptime IS NULL AND callingstationid != '%{Calling-Station-Id}' AND (acctupdatetime > NOW() - INTERVAL '3 minutes' OR (acctupdatetime IS NULL AND acctstarttime > NOW() - INTERVAL '3 minutes'))}" >= "%{control:Simultaneous-Use}") {
                update reply {
                    &Reply-Message := "Simultaneous-Use limit reached"
                }
                reject
            }
        }
        else {
            if ("%{sql:SELECT COUNT(*) FROM radacct WHERE username='%{SQL-User-Name}' AND acctstoptime IS NULL AND (acctupdatetime > NOW() - INTERVAL '3 minutes' OR (acctupdatetime IS NULL AND acctstarttime > NOW() - INTERVAL '3 minutes'))}" >= "%{control:Simultaneous-Use}") {
                update reply {
                    &Reply-Message := "Simultaneous-Use limit reached"
                }
                reject
            }
        }
    }
}

# 3) set_ippool_name: Dynamic Router-Aware Pool & PPP Profile Resolution
#    Menemukan nama PPP Profile / SQL IP Pool spesifik untuk router tempat pelanggan dial-in (Nas-IP-Address)
#    berdasarkan ProfileGroup wilayah pelanggan atau binding NAS langsung.
#    JIKA router tempat dial-in TIDAK memiliki PPP Profile yang sesuai dengan wilayah pelanggan:
#    MAKA tolak (REJECT) koneksi PPPoE agar pelanggan tidak mendapatkan profil/gateway yang salah.
set_ippool_name {
    # 1. Cari nama PPP Profile pada router NAS ini yang sesuai dengan ProfileGroup / NAS binding pelanggan
    update control {
        &Tmp-String-0 := "%{sql:SELECT p.name FROM ppp_profile p JOIN nas_router n ON p.\"nasId\" = n.id JOIN customer c ON ((c.\"profileGroupId\" IS NOT NULL AND c.\"profileGroupId\" = p.\"profileGroupId\") OR (c.\"nasId\" IS NOT NULL AND c.\"nasId\" = p.\"nasId\")) WHERE c.username = '%{SQL-User-Name}' AND n.\"ipAddress\" = '%{Nas-IP-Address}' LIMIT 1}"
    }

    # 2. Jika ditemukan PPP Profile yang cocok untuk router NAS tempat dial-in:
    if ("%{control:Tmp-String-0}" != "") {
        # Pasang Pool-Name untuk modul sqlippool (mengoverride pool_name agar IP dialokasikan dari router ini)
        update control {
            &Pool-Name := "%{control:Tmp-String-0}"
        }
        # Pasang Mikrotik-Group ke nama profile pada router ini (untuk gateway/local-address & parent-queue)
        update reply {
            &Mikrotik-Group := "%{control:Tmp-String-0}"
        }
        # Cek apakah router ini menggunakan ipModule = 'mikrotik_pool'
        if ("%{sql:SELECT p.\"ipModule\" FROM ppp_profile p JOIN nas_router n ON p.\"nasId\" = n.id JOIN customer c ON ((c.\"profileGroupId\" IS NOT NULL AND c.\"profileGroupId\" = p.\"profileGroupId\") OR (c.\"nasId\" IS NOT NULL AND c.\"nasId\" = p.\"nasId\")) WHERE c.username = '%{SQL-User-Name}' AND n.\"ipAddress\" = '%{Nas-IP-Address}' LIMIT 1}" == "mikrotik_pool") {
            update reply {
                &Framed-Pool := "%{control:Tmp-String-0}"
            }
        }
        else {
            # ipModule = 'sql' (FreeRADIUS sqlippool yang mengalokasikan IP), jangan kirim Framed-Pool ke MikroTik
            update reply {
                &Framed-Pool !* ANY
            }
        }
    }
    # 3. Router ini TIDAK memiliki PPP Profile yang sesuai dengan ProfileGroup wilayah / NAS binding pelanggan!
    else {
        update reply {
            &Reply-Message := "Router tidak terdaftar dalam wilayah layanan pelanggan (PPP Profile tidak ditemukan)"
        }
        reject
    }
}

# 4) cleanup_ippool_reply: Hapus Framed-Pool dari paket respon jika Framed-IP-Address berhasil dialokasikan oleh sqlippool
cleanup_ippool_reply {
    if (reply:Framed-IP-Address && reply:Framed-Pool) {
        update reply {
            &Framed-Pool !* ANY
        }
    }
}
