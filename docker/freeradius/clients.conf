# FreeRADIUS clients — RADIUS client (NAS) boleh dari:
#  - localhost (untuk radtest / debugging di dalam container)
#  - subnet docker 172.30.0.0/24 (MikroTik CHR + test harness)
#
# Catatan: dengan read_clients=yes di modul sql, entri di tabel `nas`
# (dikelola aplikasi) diutamakan. Entri di sini tetap diperlukan agar
# radtest lokal dan koneksi subnet docker tidak ditolak.
client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
	require_message_authenticator = no
	nas_type = other
}

client microrad-net {
	ipaddr = 172.30.0.0/24
	secret = testing123
	require_message_authenticator = no
}